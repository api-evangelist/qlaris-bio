aid: qlaris-bio
name: Qlaris Bio
description: Qlaris Bio is a clinical-stage biotechnology company focused on developing first-in-class
  therapies for ophthalmic diseases, with a mission to preserve vision and prevent blindness. Its lead
  candidate, QLS-111, uses a novel mechanism of action to lower intraocular pressure by targeting the
  distal outflow pathway, and is being evaluated for primary open-angle glaucoma, ocular hypertension,
  and elevated IOP associated with conditions such as Sturge-Weber Syndrome. The company was surfaced as
  a portfolio company of Canaan Partners and added to the API Evangelist network. As a clinical-stage
  drug developer, Qlaris Bio publishes a corporate website but no public developer, API, or product
  integration surface.
